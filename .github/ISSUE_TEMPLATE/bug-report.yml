name: Bug report
description: Something does not work as it should.
labels: ["kind:bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      placeholder: The invoice for order 1234 shows 10.00 instead of 10.01.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      placeholder: Totals are rounded half-up to the cent.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: Steps, links, order numbers, screenshots.
      placeholder: |
        1. Place an order with a line total of 10.005
        2. Open the invoice
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did you see it?
      placeholder: Web checkout, invoice page, partner API
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Customers or partners are blocked
        - There is a workaround
        - Cosmetic or internal only
    validations:
      required: true
